name: Test
on:
  push:
    branches: [ main ]
  pull_request:
jobs:
  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Install dependencies
        run: uv lock --python ${{ matrix.python-version }} && uv sync --python ${{ matrix.python-version }} --all-extras
      - name: Run pytest
        run: uv run pytest .
