[project]
name = "kubex-k8s-1-38"
version = "0.1.0-alpha.1"
description = "Pydantic v2 Kubernetes 1.38 resource models for Kubex"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT License"}
authors = [
    {name = "Codemageddon", email = "dev@codemageddon.me"},
]
dependencies = [
    "pydantic>=2.0,<3",
    "kubex-core>=0.1.0b4,<0.2",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Framework :: Pydantic :: 2",
  "Typing :: Typed",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
only-include = ["kubex"]

[tool.hatch.build.targets.wheel]
packages = ["kubex"]

[tool.mypy]
namespace_packages = true
explicit_package_bases = true

[tool.ty.environment]
# Point ty to the workspace venv so it can resolve pydantic, kubex_core, etc.
# when editing generated files directly.
python = "../../.venv"
