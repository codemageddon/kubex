[project]
name = "kubex-core"
version = "0.1.0-beta.4"
description = "Core model types shared by Kubex and its generated resource packages"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT License"}
authors = [
    {name = "Codemageddon", email = "dev@codemageddon.me"},
]
dependencies = [
    "pydantic>=2.0,<3",
    "pyyaml>=6.0.2",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Framework :: Pydantic :: 2",
  "Typing :: Typed",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
only-include = ["kubex_core"]

[tool.hatch.build.targets.wheel]
packages = ["kubex_core"]

# The root `mypy .` excludes `packages/` and only reads kubex_core as an
# installed package, so it never reports errors here. CI checks this package
# separately: `uv run --directory packages/kubex-core mypy kubex_core`.
[tool.mypy]
strict = true
namespace_packages = true
explicit_package_bases = true
plugins = ["pydantic.mypy"]
