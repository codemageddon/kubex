[project]
name = "kubex-runtime"
version = "0.1.0-alpha.1"
description = "Controller runtime for Kubex: watchers, reflectors, controllers and finalizers"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT License"}
authors = [
    {name = "Codemageddon", email = "dev@codemageddon.me"},
]
dependencies = [
    # 0.1.0b5 is the first with kubex.core.exception_groups, and with watches
    # and log streams that close their response when closed early
    "kubex>=0.1.0b5,<0.2",
    "kubex-core>=0.1.0b5,<0.2",
    # anyio.move_on_at is new in 4.15
    "anyio>=4.15.0",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Clustering",
  "Framework :: AsyncIO",
  "Framework :: Trio",
  "Framework :: AnyIO",
  "Typing :: Typed",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Free Threading :: 2 - Beta",
]

[project.urls]
Homepage = "https://kubex.codemageddon.me/"
Repository = "https://github.com/codemageddon/kubex.git"
Issues = "https://github.com/codemageddon/kubex/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
only-include = ["kubex_runtime"]

[tool.hatch.build.targets.wheel]
packages = ["kubex_runtime"]

[tool.uv.sources]
kubex = { workspace = true }
kubex-core = { workspace = true }

# The root `mypy .` excludes `packages/`, so it never reports errors here. CI
# checks this package separately:
# `uv run --directory packages/kubex-runtime mypy kubex_runtime`.
[tool.mypy]
strict = true
namespace_packages = true
explicit_package_bases = true
plugins = ["pydantic.mypy"]
